spring:
  application:
    name: ai-code-helper
  datasource:
    url: jdbc:mysql://localhost:3306/ai_helper_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: <your-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8081
  servlet:
    context-path: /api

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: <your-key>
        model-name: qwen-max
      embedding-model:
        api-key: <your-key>
        model-name: text-embedding-v3
      streaming-chat-model:
        model-name: qwen-max
        api-key: <your-key>
bigmodel:
  api-key: <your-key>

chroma:
  url: http://localhost:8000
  collection-name: companion_memory

companion:
  user:
    name: KINLIK
    profile: "理性敏感、偶尔焦虑、需要被温柔理解和稳定陪伴"
  emotion-check-time: "22:00"
  emotion-check-cron: "0 0 22 * * ?"
